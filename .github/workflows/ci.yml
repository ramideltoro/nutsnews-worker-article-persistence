name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: nutsnews_worker_test
          POSTGRES_USER: nutsnews_worker_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutsnews_worker_test -d nutsnews_worker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@ramideltoro"

      - name: Validate security baseline
        run: python3 scripts/validate_security_baseline.py

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Validate repository bootstrap
        shell: bash
        run: |
          set -euo pipefail

          test -s README.md
          test -s LICENSE
          test -s SECURITY.md
          test -s docs/repository-boundary.md
          test -s .github/CODEOWNERS
          test -s .github/PULL_REQUEST_TEMPLATE.md
          test -s .github/dependabot.yml

          grep -q "production-backend" README.md
          grep -q "production-backend" docs/repository-boundary.md
          grep -q "@ramideltoro" .github/CODEOWNERS

      - name: Run service checks
        env:
          NUTSNEWS_PERSISTENCE_TEST_DATABASE_URL: postgresql://nutsnews_worker_test:local-ci-only@127.0.0.1:5432/nutsnews_worker_test
        run: npm run ci

      - name: Build container locally
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker build --pull=false --build-arg BUILD_REVISION=${{ github.sha }} --secret id=npm_token,env=NODE_AUTH_TOKEN -t nutsnews-worker-article-persistence:${{ github.sha }} .

      - name: Validate minimal runtime container
        run: |
          docker run --rm --entrypoint sh nutsnews-worker-article-persistence:${{ github.sha }} -ec '
            test ! -e /usr/local/bin/npm
            test ! -e /usr/local/bin/npx
            test ! -d /usr/local/lib/node_modules/npm
            test ! -d /app/node_modules/typescript
            test ! -d /app/node_modules/vitest
          '
