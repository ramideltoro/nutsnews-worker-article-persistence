name: Publish Container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-container:
    name: publish-container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/ramideltoro/nutsnews-worker-article-persistence:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Dockerfile
        id: dockerfile
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f Dockerfile ]]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip until Dockerfile exists
        if: steps.dockerfile.outputs.has_dockerfile != 'true'
        run: echo "No Dockerfile is present yet."

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Login to GHCR
        if: steps.dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SHA-tagged image
        if: steps.dockerfile.outputs.has_dockerfile == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ramideltoro/nutsnews-worker-article-persistence
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: steps.dockerfile.outputs.has_dockerfile == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image
        if: steps.dockerfile.outputs.has_dockerfile == 'true'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes "${IMAGE}"
